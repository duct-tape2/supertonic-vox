      - ".github/workflows/cross-platform-foundation.yml"
  workflow_dispatch:
    inputs:
      windows_release_preflight:
        description: "Windows successor release check"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "capture-inventory"
          - "unsigned-preflight"

permissions:
  contents: read

jobs:
  privacy-gate:
    name: Release privacy gate self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install isolated VoxCPM2 contract-test dependencies
        run: python -m pip install --disable-pip-version-check -r src/VoxCPM2Sidecar/tests/requirements-test.txt
      - name: Run VoxCPM2 protocol-v2 and pack-builder tests
        run: |
          python -m unittest discover -s src/VoxCPM2Sidecar/tests -p 'test_*.py' -v
          python -m unittest tools.test_build_voxcpm2_runtime_pack -v
          python -m unittest tools.test_package_voxcpm2_runtime_pack -v
      - name: Run fail-closed privacy fixtures
        run: python tools/release_privacy_gate.py --self-test
      - name: Run privacy gate unit tests
        run: python -m unittest tools/test_release_privacy_gate.py tools/test_fetch_supertonic_model.py tools/test_release_history_audit.py tools/test_release_open_gates.py tools/test_final_release_evidence.py tools/test_windows_preflight_contract.py tools/test_windows_msi_contract.py tools/test_macos_release_contract.py -v
      - name: Run full-history audit negative controls
        run: python tools/release_history_audit.py --self-test
      - name: Verify actual repository history posture
        run: python tools/repository_privacy_posture.py --repo .

  build-test:
    name: ${{ matrix.os }} / .NET 10
    needs: privacy-gate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: |
            src/CrossPlatform/**/packages.lock.json
            tests/SupertonicVox.Core.Tests/packages.lock.json
            tools/**/packages.lock.json
      - name: Restore locked dependencies
        run: dotnet restore SupertonicVox.CrossPlatform.slnx --locked-mode
      - name: Build
        run: dotnet build SupertonicVox.CrossPlatform.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/SupertonicVox.Core.Tests/SupertonicVox.Core.Tests.csproj --configuration Release --no-build

  windows-release-preflight:
    name: Windows x64 unsigned release preflight
    if: github.event_name == 'workflow_dispatch' && inputs.windows_release_preflight != 'none'
    needs: privacy-gate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: |
            src/CrossPlatform/**/packages.lock.json
            tests/SupertonicVox.Core.Tests/packages.lock.json
            tools/**/packages.lock.json
      - name: Capture literal Windows publish inventory
        if: inputs.windows_release_preflight == 'capture-inventory'
        shell: pwsh
        run: >-
          ./packaging/build-windows-release.ps1
          -CapturePublishInventory
          -Output "${{ github.workspace }}\artifacts\windows-ci-output"
      - name: Build unsigned Windows package
        if: inputs.windows_release_preflight == 'unsigned-preflight'
        shell: pwsh
        run: >-
          ./packaging/build-windows-release.ps1
          -PreflightUnsigned
          -Output "${{ github.workspace }}\artifacts\windows-ci-output"
      - name: Revalidate unsigned package evidence
        if: inputs.windows_release_preflight == 'unsigned-preflight'
        run: >-
          python tools/windows_preflight_contract.py validate-evidence
          --evidence artifacts/windows-ci-output/release-evidence.json
          --output-root artifacts/windows-ci-output
      - name: Upload non-distributable validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ inputs.windows_release_preflight }}-${{ github.sha }}
          path: artifacts/windows-ci-output
          if-no-files-found: error
          retention-days: 7
