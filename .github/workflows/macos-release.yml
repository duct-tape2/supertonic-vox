name: macOS signed release validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Fail-closed macOS operation"
        required: true
        type: choice
        options:
          - capture-signing-policy
          - signed-candidate
      first_release:
        description: "No prior signed/notarized/stapled DMG exists"
        required: true
        default: true
        type: boolean
      first_production_catalog:
        description: "No prior production catalog verifier report exists"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-production-release
  cancel-in-progress: false

jobs:
  validate-macos:
    name: Protected Apple Silicon signed-candidate validation
    runs-on: [self-hosted, macos, arm64, supertonic-release]
    environment: production-release
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: |
            src/CrossPlatform/**/packages.lock.json
            tests/SupertonicVox.Core.Tests/packages.lock.json
            tools/**/packages.lock.json
      - name: Validate macOS contracts and negative controls
        shell: bash
        run: |
          python3 tools/macos_release_contract.py validate-contract
          python3 tools/macos_release_contract.py validate-policy
          python3 -m unittest tools/test_macos_release_contract.py -v
      - name: Capture normalized signing-policy candidate
        if: inputs.mode == 'capture-signing-policy'
        shell: bash
        run: |
          ./packaging/build-macos-release.sh \
            --capture-signing-policy \
            --offline-models \
            --model-cache "${{ vars.SVX_MACOS_MODEL_CACHE }}" \
            --output "${{ vars.SVX_RELEASE_EVIDENCE_ROOT }}/${{ github.sha }}/macos-signing-policy"
      - name: Create ephemeral signing and notary keychain
        if: inputs.mode == 'signed-candidate'
        id: keychain
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.SVX_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SVX_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.SVX_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.SVX_NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.SVX_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/svx-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          CERTIFICATE_PATH="$RUNNER_TEMP/svx-developer-id.p12"
          NOTARY_PROFILE="svx-notary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SETUP_COMPLETE=0
          cleanup_failed_setup() {
            if [ "$SETUP_COMPLETE" = "0" ]; then
              security lock-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
              security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
              rm -f "$CERTIFICATE_PATH"
            fi
          }
          trap cleanup_failed_setup EXIT
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"
          CERTIFICATE_SHA1=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ {print $2}' | head -1)
          [[ "$CERTIFICATE_SHA1" =~ ^[0-9A-Fa-f]{40}$ ]]
          {
            echo "keychain_path=$KEYCHAIN_PATH"
            echo "notary_profile=$NOTARY_PROFILE"
            echo "certificate_sha1=$CERTIFICATE_SHA1"
          } >> "$GITHUB_OUTPUT"
          rm -f "$CERTIFICATE_PATH"
          SETUP_COMPLETE=1
      - name: Build signed, notarized, stapled noneligible candidate
        if: inputs.mode == 'signed-candidate'
        shell: bash
        run: |
          set -euo pipefail
          arguments=(
            --build-signed-candidate
            --offline-models
            --model-cache "${{ vars.SVX_MACOS_MODEL_CACHE }}"
            --output "${{ vars.SVX_RELEASE_EVIDENCE_ROOT }}/${{ github.sha }}/macos-signed-candidate"
            --certificate-sha1 "${{ steps.keychain.outputs.certificate_sha1 }}"
            --notary-profile "${{ steps.keychain.outputs.notary_profile }}"
            --notary-keychain "${{ steps.keychain.outputs.keychain_path }}"
            --production-catalog-assets "${{ vars.SVX_PRODUCTION_CATALOG_ASSETS }}"
            --source-license-approval "${{ vars.SVX_SOURCE_LICENSE_APPROVAL }}"
            --model-redistribution-approval "${{ vars.SVX_MODEL_REDISTRIBUTION_APPROVAL }}"
          )
          if [ "${{ inputs.first_production_catalog }}" = "true" ]; then
            arguments+=(--first-production-catalog)
          else
            arguments+=(--catalog-baseline "${{ vars.SVX_CATALOG_BASELINE_REPORT }}")
          fi
          if [ "${{ inputs.first_release }}" = "true" ]; then
            arguments+=(--first-release)
          else
            arguments+=(--prior-signed-dmg "${{ vars.SVX_PRIOR_SIGNED_DMG }}")
          fi
          ./packaging/build-macos-release.sh "${arguments[@]}"
      - name: Destroy ephemeral signing material
        if: always() && inputs.mode == 'signed-candidate'
        shell: bash
        run: |
          set +e
          KEYCHAIN_PATH="$RUNNER_TEMP/svx-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          security lock-keychain "$KEYCHAIN_PATH"
          security delete-keychain "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/svx-developer-id.p12"
      - name: Confirm workflow never publishes
        shell: bash
        run: |
          echo 'No artifact upload, release, comment, or external publication step exists.'
          echo 'Every generated candidate remains releaseEligible=false.'
