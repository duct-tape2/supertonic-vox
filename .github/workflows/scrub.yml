name: Scrub check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scrub:
    name: Privacy and credential check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.4.0
      - uses: actions/setup-node@v4 # v4.1.2
        with:
          node-version: "20"
      - name: Run scrub-check
        run: node scripts/scrub-check.mjs
